<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan maratón Badajoz</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--tx:#1a1a18;--mut:#6b6a65;--bd:#e3e2dc;--acc:#2a78d6;--accbg:#e6f1fb;--ok:#1d8a4e;--okbg:#e7f5ec}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--tx:#f0efec;--mut:#a3a29b;--bd:#33332f;--acc:#5a9de8;--accbg:#1b2c40;--ok:#4cc27f;--okbg:#17301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:760px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0}
.sub{color:var(--mut);font-size:13px;margin:2px 0 14px}
.today{background:var(--accbg);border:1px solid var(--acc);border-radius:12px;padding:14px;margin-bottom:14px}
.today .lbl{font-size:12px;color:var(--acc);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.today .t{font-size:18px;font-weight:600;margin:4px 0}
.today .d{font-size:14px;color:var(--mut)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 16px}
.bar span{display:block;height:100%;background:var(--ok)}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}
summary{padding:12px 14px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;list-style:none}
summary::-webkit-details-marker{display:none}
summary small{font-weight:400;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{border-top:1px solid var(--bd);padding:9px 8px;vertical-align:top}
td.dia{width:58px;color:var(--mut);font-size:13px;white-space:nowrap}
td.ck{width:40px;text-align:center}
tr.hoy td{background:var(--accbg)}
tr.done .ses{text-decoration:line-through;color:var(--mut)}
.ses{font-weight:500}
.det{font-size:12.5px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);padding:0 14px 10px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok)}
.foot{font-size:12px;color:var(--mut);margin-top:16px}
</style>
</head>
<body>
<h1>Maratón de Badajoz · 3h30</h1>
<p class="sub" id="sub"></p>
<div class="today" id="today"></div>
<div style="font-size:13px;color:var(--mut)" id="prog"></div>
<div class="bar"><span id="progbar" style="width:0"></span></div>
<div id="weeks"></div>
<p class="foot">Ritmos: suave 5:35–6:05 · ritmo maratón (RM) 4:55–5:00 · umbral 4:30–4:38 · VO2máx 4:08–4:15 /km.<br>
Las casillas marcadas se guardan solo en este navegador. Si el plan cambia tras una revisión, se actualiza este archivo.</p>

<script>
const RACE = new Date(2027, 2, 7);   // domingo 7 mar 2027
const WEEKS = 17;
const START = new Date(RACE); START.setDate(START.getDate() - (WEEKS * 7 - 1)); // lunes semana 1

const E  = (k, st) => ['Rodaje suave ' + k + ' km' + (st ? ' + ' + st + ' rectas' : ''), 'Suave 5:35–6:05' + (st ? '. Al final ' + st + '×20" rápidas con 1\' trote' : ''), k + (st ? 1 : 0)];
const L  = (k, mp) => ['Tirada larga ' + k + ' km', mp ? (k - mp) + ' km suave + últimos ' + mp + ' km a RM' : 'Todo suave 5:35–6:05. Practica geles si pasa de 90\'', k];
const I  = (t, d, k) => [t, '3 km calentamiento, ' + d + ', 2 km vuelta a la calma', k];
const H  = (r, s) => ['Cuestas ' + r + '×' + s + '"', '3 km calentamiento, ' + r + ' subidas a esfuerzo de 5K, bajada trotando, 2 km suaves', 8];
const TP = m => ['Tempo ' + m + '\' a umbral', '3 km calentamiento, ' + m + '\' a 4:30–4:38, 2 km vuelta a la calma', 5 + Math.round(m / 4.6)];
const MR = k => [k + ' km a ritmo maratón', '2 km suave, ' + k + ' km a 4:55–5:00, 2 km suave', k + 4];
const PR = (e, m) => ['Progresivo ' + (e + m) + ' km', e + ' km suave + ' + m + ' km a RM', e + m];
const REST = ['Descanso', '', 0], GYM = ['Fuerza en gimnasio', 'Glúteo medio, sentadilla unipodal, puente, peso muerto rumano y gemelo (40\')', 0];

// [fase, nota, martes, miércoles, jueves, sábado, domingo]
const PLAN = [
 ['Base','Adaptación', H(8,30), E(7), PR(5,2), E(5,6), L(14)],
 ['Base','', I('Fartlek 8×1\'', '8×1\' rápido / 1\' suave', 10), E(8), TP(15), E(5,6), L(16)],
 ['Base','', H(10,45), E(8), I('2×10\' a umbral', '2×10\' a 4:30–4:38 con 3\' trote', 10), E(6,8), L(18)],
 ['Base','Descarga', I('Fartlek 6×1\'', '6×1\' rápido / 1\' suave', 8), E(6), PR(4,2), E(5,6), L(14)],
 ['Construcción','', I('5×1 km a umbral', '5×1 km a 4:30–4:38 con 2\' trote', 10), E(9), I('2×3 km a RM', '2×3 km a 4:55–5:00 con 3\' trote', 11), E(6,6), L(20)],
 ['Construcción','', I('6×1 km a umbral', '6×1 km a 4:30–4:38 con 2\' trote', 11), E(9), I('2×4 km a RM', '2×4 km a 4:55–5:00 con 3\' trote', 13), E(6,6), L(22)],
 ['Construcción','', I('5×3\' VO2máx', '5×3\' a 4:08–4:15 con 2\' trote', 9), E(10), TP(25), E(7,8), L(24,5)],
 ['Construcción','Descarga', I('10×200 m rápidos', '10×200 m a 3:35–3:50 con 1\'30" trote', 7), E(8), TP(15), E(6), L(18)],
 ['Construcción','', I('4×2 km a umbral', '4×2 km a 4:30–4:38 con 3\' trote', 14), E(10), MR(8), E(7,6), L(26)],
 ['Construcción','Test el domingo', I('6×1 km a umbral', '6×1 km a 4:30–4:38 con 2\' trote', 11), E(10), E(8,6), E(5,4), ['Test: media maratón a tope', '2 km suave + 21,1 km a tope (objetivo < 1:40) + 2 km trote', 25]],
 ['Específico','', I('3×3 km a umbral', '3×3 km a 4:30–4:38 con 3\' trote', 15), E(11), MR(12), E(7,6), L(28,8)],
 ['Específico','Descarga', I('5×1 km a umbral', '5×1 km a 4:30–4:38 con 2\' trote', 10), E(9), MR(6), E(6,6), L(22)],
 ['Específico','Primera de 30 km', I('4×2 km a umbral', '4×2 km a 4:30–4:38 con 3\' trote', 14), E(11), I('2×5 km a RM', '2×5 km a 4:55–5:00 con 3\' trote', 15), E(7,6), L(30,6)],
 ['Específico','Semana pico', I('6×1 km a umbral', '6×1 km a 4:30–4:38 con 2\' trote', 11), E(11), MR(10), E(7,6), L(32,5)],
 ['Tapering','', I('5×1 km a umbral', '5×1 km a 4:30–4:38 con 2\' trote', 10), E(10), MR(8), E(6,6), L(24,6)],
 ['Tapering','', I('4×1 km a umbral', '4×1 km a 4:30–4:38 con 2\' trote', 9), E(8), MR(6), E(6,4), L(16,4)],
 ['Tapering','Semana de carrera', I('4×1 km a RM', '4×1 km a 4:55–5:00 con 2\' trote', 9), E(6), PR(4,2), E(4,4), ['MARATÓN DE BADAJOZ', '42,2 km a 4:55–5:00. Sal conservador los 5 primeros km', 42.2]],
];

const DN = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MN = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const day = (w, d) => { const x = new Date(START); x.setDate(x.getDate() + w * 7 + d); return x; };
const key = x => x.getFullYear() + '-' + (x.getMonth() + 1) + '-' + x.getDate();
const fmt = x => x.getDate() + ' ' + MN[x.getMonth()];
const now = new Date(); const todayKey = key(now);

let done = {};
try { done = JSON.parse(localStorage.getItem('plan-done') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('plan-done', JSON.stringify(done)); } catch (e) {} };

const sessions = w => { const p = PLAN[w]; return [REST, p[2], p[3], p[4], GYM, p[5], p[6]]; };

let html = '', total = 0, curW = -1, todayS = null;
PLAN.forEach((p, w) => {
  const ss = sessions(w), first = day(w, 0), last = day(w, 6);
  const km = Math.round(ss.reduce((a, s) => a + s[2], 0));
  const isCur = now >= first && now < new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1);
  if (isCur) curW = w;
  let rows = '';
  ss.forEach((s, d) => {
    const dt = day(w, d), k = key(dt), runnable = s[2] > 0 || s === GYM;
    if (k === todayKey) todayS = { s, dt, w };
    if (runnable) total++;
    rows += '<tr class="' + (k === todayKey ? 'hoy ' : '') + (done[k] ? 'done' : '') + '" data-k="' + k + '">' +
      '<td class="dia">' + DN[d] + '<br>' + fmt(dt) + '</td>' +
      '<td><div class="ses">' + s[0] + (s[2] ? ' <span class="det">· ' + s[2] + ' km</span>' : '') + '</div>' + (s[1] ? '<div class="det">' + s[1] + '</div>' : '') + '</td>' +
      '<td class="ck">' + (runnable ? '<input type="checkbox" aria-label="Completado ' + fmt(dt) + '"' + (done[k] ? ' checked' : '') + '>' : '') + '</td></tr>';
  });
  html += '<details' + (isCur ? ' open' : '') + ' id="w' + w + '"><summary><span>Semana ' + (w + 1) + ' · ' + p[0] + '</span><small>' + fmt(first) + '–' + fmt(last) + ' · ' + km + ' km</small></summary>' +
    (p[1] ? '<div class="note">' + p[1] + '</div>' : '') + '<table>' + rows + '</table></details>';
});
document.getElementById('weeks').innerHTML = html;

const daysLeft = Math.ceil((RACE - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
document.getElementById('sub').textContent = daysLeft > 0 ? 'Faltan ' + daysLeft + ' días · domingo 7 mar 2027' : 'Carrera: 7 mar 2027';
const T = document.getElementById('today');
if (todayS) T.innerHTML = '<div class="lbl">Hoy · ' + DN[(now.getDay() + 6) % 7] + ' ' + fmt(now) + ' · semana ' + (todayS.w + 1) + '</div><div class="t">' + todayS.s[0] + (todayS.s[2] ? ' · ' + todayS.s[2] + ' km' : '') + '</div><div class="d">' + (todayS.s[1] || 'Recupera bien.') + '</div>';
else T.innerHTML = '<div class="lbl">Hoy</div><div class="t">' + (now < START ? 'El plan empieza el ' + fmt(START) : 'Plan terminado') + '</div>';

function progress() {
  const n = Object.values(done).filter(Boolean).length;
  document.getElementById('prog').textContent = n + ' de ' + total + ' sesiones completadas';
  document.getElementById('progbar').style.width = Math.round(n / total * 100) + '%';
}
document.getElementById('weeks').addEventListener('change', e => {
  const tr = e.target.closest('tr'); const k = tr.dataset.k;
  done[k] = e.target.checked; if (!done[k]) delete done[k];
  tr.classList.toggle('done', e.target.checked); save(); progress();
});
progress();
</script>
</body>
</html>
